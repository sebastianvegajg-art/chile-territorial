services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chile_territorial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD fuera de Git}
    ports:
      - "127.0.0.1:${PIB_DB_PORT:-54327}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "chile_territorial"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos:
